# Build the Eclixtech Chatwoot image (Community Edition + eclix/patches) and
# publish it to GHCR. Mirrors upstream's publish_foss_docker.yml, amd64 only.
#
# - push of a vX.Y.Z-eclixN tag      -> :vX.Y.Z-eclixN   (releases; what the server runs)
# - push/merge to the `eclix` branch -> :eclix-<sha> and :eclix-latest
#   (`master`/`develop` are untouched upstream mirrors and are never built)
name: Eclix build image

on:
  push:
    tags: ['v*-eclix*']
    branches: [eclix]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z-eclixN tag to (re)build'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: eclix-build-${{ inputs.tag || github.ref_name }}
  # A newer push to the branch supersedes a running branch build; release
  # tag builds always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' && !inputs.tag }}

jobs:
  build:
    # GitHub-hosted on purpose: this repo is public (forks of public repos
    # must be), and self-hosted runners must never run public-repo code.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IS_BRANCH: ${{ github.ref_type == 'branch' && !inputs.tag }}
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/eclix-web/chatwoot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IS_BRANCH == 'true' && github.sha || format('refs/tags/{0}', env.TAG) }}

      - name: Image tags
        id: tags
        run: |
          if [[ "$IS_BRANCH" == true ]]; then
            echo "list=$IMAGE:eclix-${GITHUB_SHA::7},$IMAGE:eclix-latest" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-eclix[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }
            echo "list=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Strip enterprise code (Community Edition)
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IS_BRANCH == 'true' && format('eclix-{0}', github.sha) || env.TAG }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Published \`${{ steps.tags.outputs.list }}\`" >> "$GITHUB_STEP_SUMMARY"
