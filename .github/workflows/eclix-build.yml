# Build the Eclixtech Chatwoot image (Community Edition + eclix/patches) and
# publish it to GHCR. Mirrors upstream's publish_foss_docker.yml, amd64 only.
name: Eclix build image

on:
  push:
    tags: ['v*-eclix*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z-eclixN tag to (re)build'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: eclix-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted on purpose: this repo is public (forks of public repos
    # must be), and self-hosted runners must never run public-repo code.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/eclix-web/chatwoot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check tag shape
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-eclix[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }'

      - name: Strip enterprise code (Community Edition)
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Published \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
